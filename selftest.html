<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mira — Portfolio</title>
<meta name="description" content="Frontend developer and pixel artist. Portfolio.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F9A8D0">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23F9A8D0'/%3E%3Cpath d='M4 3h3v1H4zM9 3h3v1H9zM3 4h10v3H3zM4 7h8v1H4zM5 8h6v1H5zM6 9h4v1H6zM7 10h2v1H7z' fill='%232B2260'/%3E%3C/svg%3E">

<!-- Порядок важен: 07-responsive.css идёт последним и переопределяет остальное -->
<link rel="stylesheet" href="./css/01-tokens.css">
<link rel="stylesheet" href="./css/02-base.css">
<link rel="stylesheet" href="./css/03-pixel-box.css">
<link rel="stylesheet" href="./css/04-layout.css">
<link rel="stylesheet" href="./css/05-components.css">
<link rel="stylesheet" href="./css/06-sky.css">

</head>

<body>

<!-- ======================= ФОН: небо с облаками ======================= -->
<div class="sky" aria-hidden="true">
  <div class="sky__layer sky__layer--far"></div>
  <div class="sky__layer sky__layer--mid"></div>
  <div class="sky__layer sky__layer--near"></div>
</div>

<!-- ======================= BOOT-ЭКРАН ======================= -->
<div class="boot" id="boot">
  <div class="boot__window px-box px-double px-drop">
    <p class="boot__label">LOADING</p>
    <div class="boot__bar px-box px-inset">
      <div class="boot__fill" id="boot-fill"></div>
    </div>
  </div>
</div>

<!-- ======================= ОКНО ======================= -->
<div class="screen px-box px-double px-drop" id="screen">

  <header class="titlebar">
    <div class="titlebar__left">
      <span class="titlebar__icon" id="window-icon"></span>
    </div>

    <h1 class="titlebar__title" id="window-title">HI, I'M MIRA</h1>

    <div class="titlebar__right">
      <button type="button" class="tbtn tbtn--sound px-box px-face"
              id="sound-btn" aria-pressed="false" aria-label="Sound off">
        <span class="tbtn__glyph" id="sound-glyph" aria-hidden="true"></span>
      </button>

      <!-- Декоративные кнопки окна: вне tab-порядка и невидимы для скринридера -->
      <span class="tbtn tbtn--min px-box px-face" aria-hidden="true">
        <span class="tbtn__glyph"></span>
      </span>
      <span class="tbtn tbtn--max px-box px-face" aria-hidden="true">
        <span class="tbtn__glyph"></span>
      </span>

      <button type="button" class="tbtn tbtn--menu px-box px-face"
              id="menu-btn" aria-expanded="true" aria-controls="stat-list"
              aria-label="Toggle menu">
        <span class="tbtn__glyph" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <div class="workspace px-dots" id="workspace">

    <!-- Колонка 1: статы.
         Осознанно nav + aria-current, а НЕ role="tablist": паттерн табов
         требует roving tabindex (один Tab-стоп, переключение стрелками),
         а здесь нужен обычный Tab по каждому стату. Стрелки работают сверху. -->
    <div class="col-left" id="col-left">
      <nav class="stats" id="stats" aria-label="Sections">
        <ul class="stats__list" id="stat-list"></ul>
      </nav>

      <!-- Панель действий. Заполняется из SITE_DATA.actions:
           два primary сверху, шесть слотов снизу, строка обратной связи. -->
      <section class="acts px-box px-double" id="actions" aria-labelledby="act-title"></section>
    </div>

    <!-- Колонка 2: персонаж -->
    <div class="hero">
      <div class="hero__bubble px-box px-bubble">
        <span id="bubble-ink" aria-hidden="true"></span>
        <span class="sr-only" id="bubble-sr"></span>
      </div>

      <div class="hero__display display px-box px-double">
        <div class="display__inner">
          <!-- #stage — обёртка под анимации состояний. Всё, что внутри .char,
               принадлежит gaze.js: он подставляет туда направление взгляда. -->
          <div class="stage" id="stage" data-state="idle">
            <div class="char" id="char"></div>
          </div>
        </div>
      </div>

      <!-- Карточка профиля: имя, стрелки, LVL, шкала XP и строки статуса.
           Собирается в app.js из SITE_DATA.profile и SITE_DATA.character -->
      <section class="charstats px-box" id="charstats" aria-label="Character profile"></section>
    </div>

    <!-- Колонка 3: контент.
         Контур .px-box рисуется снаружи, поэтому скроллит вложенный #content. -->
    <div class="content-frame px-box px-double">
      <main class="content scroll-y" id="content"
            role="region" aria-labelledby="content-title" tabindex="-1"></main>
      <footer class="footer" id="footer"></footer>
    </div>

  </div>
</div>

<!-- ======================= МОДАЛКА (<=900px) ======================= -->
<div class="modal" id="modal" data-open="false"
     role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__backdrop"></div>
  <div class="modal__window px-box px-double px-drop">
    <div class="modal__bar">
      <h2 class="modal__title" id="modal-title"></h2>
      <button type="button" class="modal__close px-box px-face"
              id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body scroll-y" id="modal-body"></div>
  </div>
</div>

<!-- ======================= БЕЗ JS =======================
     Весь контент живёт в data.js, поэтому без JS страница была бы пуста.
     Совместить «контент только в data.js» и «работает без JS» нельзя —
     здесь сознательно продублирован минимум. Держите его в синхроне с data.js. -->
<noscript>
  <div class="noscript px-box px-drop">

    <p>Frontend developer and pixel artist.</p>
    <p>This portfolio needs JavaScript to run. Here are the important bits:</p>
    <ul class="links">
      <li><a class="link px-box px-face" href="mailto:mira@example.com">EMAIL</a></li>
      <li><a class="link px-box px-face" href="https://github.com/example" rel="noopener noreferrer">GITHUB</a></li>
      <li><a class="link px-box px-face" href="https://t.me/example" rel="noopener noreferrer">TELEGRAM</a></li>
    </ul>
  </div>
</noscript>

<!-- Классические скрипты, без type="module": через file:// модули блокируются CORS.
     Порядок = порядок зависимостей. -->
<script src="./data.js"></script>
<script src="./js/dom.js"></script>
<script src="./js/store.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/typewriter.js"></script>
<script src="./js/gaze.js"></script>
<script src="./js/character.js"></script>
<script src="./js/render.js"></script>
<script src="./js/router.js"></script>
<script src="./js/app.js"></script>
<pre id="RESULTS" style="position:fixed;left:0;top:0;z-index:999;background:#fff;font:12px monospace"></pre>
<script>
(function () {
  var out = [], fails = 0, errors = [];
  function ok(n, c, x) {
    if (!c) fails++;
    out.push((c ? "PASS  " : "FAIL  ") + n + (c || x == null ? "" : "  -> " + x));
    var r = document.getElementById("RESULTS");
    if (r) r.textContent = out.join("\n");
  }
  function head(t) { out.push(""); out.push("== " + t + " =="); }
  window.addEventListener("error", function (e) { errors.push(String(e.message)); });
  var w0 = console.warn, e0 = console.error;
  console.warn = function () { errors.push("warn: " + [].join.call(arguments, " ")); w0.apply(console, arguments); };
  console.error = function () { errors.push("error: " + [].join.call(arguments, " ")); e0.apply(console, arguments); };
  function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 70); }); }
  function raf() {
    return new Promise(function (r) {
      var done = false;
      function fin() { if (!done) { done = true; r(); } }
      requestAnimationFrame(function () { requestAnimationFrame(fin); });
      setTimeout(fin, 90);          // страховка: headless не гарантирует кадры
    });
  }
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s, root) { return [].slice.call((root || document).querySelectorAll(s)); };
  function key(k) { document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true })); }
  function move(x, y) { document.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y, bubbles: true })); }
  function fileOf(el) { return (el.getAttribute("src") || "").split("/").pop(); }

  window.addEventListener("load", function () {
    (async function () {
      await tick(220);
      var M = window.MIRA, G = M.gaze;

      // ==================== СЛЕЖЕНИЕ: ВЫБОР СЕКТОРА ====================
      head("gaze: выбор сектора по углу");
      var R = 200, D = Math.round(R * 0.7071);
      var cases = [
        [ R,  0, "right"], [ D,  D, "downRight"], [ 0,  R, "down"], [-D,  D, "downLeft"],
        [-R,  0, "left"],  [-D, -D, "upLeft"],    [ 0, -R, "up"],   [ D, -D, "upRight"]
      ];
      cases.forEach(function (c) {
        var got = G.pickDirection(c[0], c[1], null);
        ok("вектор (" + c[0] + "," + c[1] + ") -> " + c[2], got === c[2], got);
      });
      // границы секторов: чуть не доходя до стыка и сразу за ним
      ok("угол 22° от нуля -> right", G.pickDirection(
        R * Math.cos(22 * Math.PI / 180), R * Math.sin(22 * Math.PI / 180), null) === "right");
      ok("угол 24° от нуля -> downRight", G.pickDirection(
        R * Math.cos(24 * Math.PI / 180), R * Math.sin(24 * Math.PI / 180), null) === "downRight");
      ok("перелом через 180° (angle wrap) -> left",
         G.pickDirection(-R, 1, null) === "left" && G.pickDirection(-R, -1, null) === "left");

      // ==================== СЛЕЖЕНИЕ: МЁРТВАЯ ЗОНА ====================
      head("gaze: мёртвая зона");
      ok("r=0 -> center", G.pickDirection(0, 0, null) === "center");
      ok("r=20 -> center", G.pickDirection(14, 14, null) === "center", G.pickDirection(14, 14, null));
      ok("r=59 -> center (внутри мёртвой зоны 120px)", G.pickDirection(59, 0, "right") === "center");
      ok("r=119 -> center: зона выросла вдвое",
         G.pickDirection(119, 0, "right") === "center", G.pickDirection(119, 0, "right"));
      ok("r=121 из направления -> направление сохраняется",
         G.pickDirection(121, 0, "right") === "right");
      ok("r=200 -> направление, не center", G.pickDirection(0, 200, null) === "down");
      ok("выход из center требует запаса: r=130 остаётся center",
         G.pickDirection(130, 0, "center") === "center", G.pickDirection(130, 0, "center"));
      ok("выход из center: r=140 переключает на направление",
         G.pickDirection(140, 0, "center") === "right", G.pickDirection(140, 0, "center"));

      // ==================== СЛЕЖЕНИЕ: ГИСТЕРЕЗИС ====================
      head("gaze: гистерезис");
      function at(deg, cur) {
        var a = deg * Math.PI / 180;
        return G.pickDirection(R * Math.cos(a), R * Math.sin(a), cur);
      }
      ok("из right: 33° (меньше 22.5+14) остаётся right", at(33, "right") === "right", at(33, "right"));
      ok("из right: 40° (больше запаса) уходит в downRight",
         at(40, "right") === "downRight", at(40, "right"));
      ok("из downRight: 20° остаётся downRight (без гистерезиса было бы right)",
         at(20, "downRight") === "downRight", at(20, "downRight"));
      ok("без гистерезиса тот же угол дал бы right", at(20, null) === "right");
      ok("гистерезис не залипает навсегда: 90° из right -> down",
         at(90, "right") === "down", at(90, "right"));

      // ==================== СЛЕЖЕНИЕ: ФАЙЛЫ ====================
      head("gaze: ассеты");
      var img = $(".char__img");
      ok("персонаж отрисован одним <img>", !!img && $$(".char__img").length === 1);
      ok("у спрайта есть alt", img && img.getAttribute("alt"), img && img.getAttribute("alt"));
      ok("image-rendering: pixelated", getComputedStyle(img).imageRendering === "pixelated",
         getComputedStyle(img).imageRendering);
      ok("стартовый кадр — look-center", fileOf(img) === "look-center.png", fileOf(img));

      var names = ["look-center", "look-up", "look-up-right", "look-right", "look-down-right",
                   "look-down", "look-down-left", "look-left", "look-up-left"];
      var loaded = await Promise.all(names.map(function (n) {
        return new Promise(function (r) {
          var im = new Image();
          im.onload = function () { r(im.naturalWidth); };
          im.onerror = function () { r(0); };
          setTimeout(function () { r(im.naturalWidth || 0); }, 3000);
          im.src = "./assets/sprites/" + n + ".png";
        });
      }));
      ok("все 9 спрайтов загружаются", loaded.every(function (w) { return w > 0; }),
         names.filter(function (n, i) { return !loaded[i]; }).join(","));
      ok("все 9 спрайтов одного размера 128x128",
         loaded.every(function (w) { return w === 128; }), loaded.join(","));

      // ==================== СЛЕЖЕНИЕ: РАБОТА В DOM ====================
      head("gaze: поведение на странице");
      // headless может не отдавать (hover: hover) — подменяем matchMedia,
      // чтобы проверить именно логику, а не окружение
      var realMM = window.matchMedia;
      window.matchMedia = function (q) {
        if (/hover|pointer/.test(q)) return { matches: true, addEventListener: function () {}, addListener: function () {} };
        return realMM.call(window, q);
      };
      // minSwitchMs: 0 — здесь проверяется сопоставление сектора, а не частота;
      // сам троттлинг проверяется отдельно ниже, с реальными паузами.
      var gcfg = Object.assign({}, SITE_DATA.character.gaze,
                               { returnDelay: 30, fade: 30, minSwitchMs: 0 });
      var st = G.init({ img: img, cfg: gcfg, stageEl: $(".display") });
      ok("обработчики повешены", st.enabled === true);
      ok("предзагружены все 9 картинок", st.preload.length === 9, st.preload.length);

      var b = img.getBoundingClientRect();
      var cx = b.left + b.width / 2, cy = b.top + b.height / 2;

      // headless при --dump-dom не выдаёт кадров, поэтому rAF сам не сработает:
      // сначала проверяем, что обработчик НИЧЕГО не делает синхронно,
      // потом форсируем пересчёт через публичный update().
      move(cx + 400, cy);
      ok("mousemove сам по себе картинку не меняет (пересчёт вынесен из обработчика)",
         fileOf(img) === "look-center.png", fileOf(img));
      G.update();
      ok("после пересчёта взгляд вправо", fileOf(img) === "look-right.png", fileOf(img));

      move(cx, cy + 400); G.update();
      ok("курсор снизу -> look-down", fileOf(img) === "look-down.png", fileOf(img));
      move(cx - 300, cy - 300); G.update();
      ok("курсор сверху-слева -> look-up-left", fileOf(img) === "look-up-left.png", fileOf(img));
      move(cx + 300, cy - 300); G.update();
      ok("курсор сверху-справа -> look-up-right", fileOf(img) === "look-up-right.png", fileOf(img));
      move(cx - 300, cy + 300); G.update();
      ok("курсор снизу-слева -> look-down-left", fileOf(img) === "look-down-left.png", fileOf(img));
      move(cx - 400, cy); G.update();
      ok("курсор слева -> look-left", fileOf(img) === "look-left.png", fileOf(img));
      move(cx, cy - 400); G.update();
      ok("курсор сверху -> look-up", fileOf(img) === "look-up.png", fileOf(img));
      move(cx + 5, cy + 5); G.update();
      ok("курсор в мёртвой зоне -> look-center", fileOf(img) === "look-center.png", fileOf(img));

      // возврат в center при уходе курсора за пределы окна
      move(cx + 400, cy); G.update();
      ok("подготовка: взгляд вправо", fileOf(img) === "look-right.png", fileOf(img));
      document.dispatchEvent(new MouseEvent("mouseleave"));
      await tick(120);
      ok("после ухода курсора возвращается look-center",
         fileOf(img) === "look-center.png", fileOf(img));
      ok("класс затухания снят", !img.classList.contains("is-settling"));

      // пересчёт центра на resize/scroll
      var dirtyBefore = st.dirty;
      window.dispatchEvent(new Event("resize"));
      ok("resize помечает геометрию устаревшей", st.dirty === true, String(dirtyBefore));

      // ==================== ДЁРГАНЬЕ ВНУТРИ РАМКИ ====================
      head("gaze: курсор внутри рамки персонажа");
      var frameRect = $(".display").getBoundingClientRect();
      var ir0 = img.getBoundingClientRect();
      var scx = (ir0.left + ir0.right) / 2, scy = (ir0.top + ir0.bottom) / 2;

      // Берём угол сцены: он внутри рамки, но далеко от центра спрайта —
      // по чистой математике это был бы сектор, а не center.
      var inX = frameRect.left + 10, inY = frameRect.top + 10;
      var rIn = Math.round(Math.hypot(inX - scx, inY - scy));
      ok("контрольная точка внутри рамки и ВНЕ мёртвой зоны",
         inX >= frameRect.left && inX <= frameRect.right &&
         inY >= frameRect.top && inY <= frameRect.bottom &&
         rIn > SITE_DATA.character.gaze.deadZone,
         "r=" + rIn + " при зоне " + SITE_DATA.character.gaze.deadZone);
      ok("по одному только углу эта точка дала бы направление",
         G.pickDirection(inX - scx, inY - scy, "center",
           { deadZone: SITE_DATA.character.gaze.deadZone,
             hysteresis: SITE_DATA.character.gaze.hysteresis }) !== "center");

      move(cx + 400, cy); G.update();
      ok("подготовка: смотрит вправо", fileOf(img) === "look-right.png", fileOf(img));
      move(inX, inY); G.update();
      ok("внутри рамки направление не пересчитывается — возврат в центр",
         fileOf(img) === "look-center.png", fileOf(img));
      move(frameRect.right - 10, frameRect.bottom - 10); G.update();
      ok("в противоположном углу рамки спрайт всё так же спокоен",
         fileOf(img) === "look-center.png", fileOf(img));

      // ---- частота переключений ----
      var gth = G.init({ img: img, cfg: Object.assign({}, gcfg, { minSwitchMs: 120 }),
                         stageEl: $(".display") });
      move(cx + 400, cy); G.update();
      ok("первое переключение проходит", fileOf(img) === "look-right.png", fileOf(img));
      move(cx, cy + 400); G.update();
      ok("второе переключение подряд отброшено: не чаще 1 раза в 120мс",
         fileOf(img) === "look-right.png", fileOf(img));
      await tick(200);
      G.update();
      ok("после паузы направление догоняет", fileOf(img) === "look-down.png", fileOf(img));

      // возвращаем инстанс без троттлинга для остальных проверок
      G.init({ img: img, cfg: gcfg, stageEl: $(".display") });
      move(cx + 400, cy); G.update();

      // ==================== СЦЕНА: ЦЕНТРИРОВАНИЕ И ЦЕНТР ДЛЯ GAZE ====================
      head("сцена персонажа");
      var stage = $(".display__inner");
      // Замораживаем анимацию обёртки: дыхание даёт субпиксельный сдвиг и
      // геометрию мерить в его середине бессмысленно. Проверяем вёрстку.
      var animHost = $("#stage");
      animHost.style.animation = "none";
      var ir = img.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      var padTop = ir.top - sr.top, padBottom = sr.bottom - ir.bottom;
      var padLeft = ir.left - sr.left, padRight = sr.right - ir.right;

      ok("поля над спрайтом и под ним равны", Math.abs(padTop - padBottom) <= 1,
         Math.round(padTop) + " сверху / " + Math.round(padBottom) + " снизу");
      ok("поля слева и справа равны", Math.abs(padLeft - padRight) <= 1,
         Math.round(padLeft) + " / " + Math.round(padRight));
      ok("спрайт не прижат к нижней грани рамки", padBottom >= 16, Math.round(padBottom));
      ok("центр спрайта совпадает с центром рамки по обеим осям",
         Math.abs((ir.left + ir.right) / 2 - (sr.left + sr.right) / 2) <= 1 &&
         Math.abs((ir.top + ir.bottom) / 2 - (sr.top + sr.bottom) / 2) <= 1);
      var w = Math.round(ir.width), hh = Math.round(ir.height);
      ok("спрайт выводится целым множителем исходного размера",
         w === hh && w % SITE_DATA.character.frameSize === 0,
         w + "x" + hh + " при исходнике " + SITE_DATA.character.frameSize);

      // gaze меряет сам <img>, поэтому после центрирования его центр —
      // это середина рамки. Проверяем от неё, а не от прежнего низа.
      var fcx = (ir.left + ir.right) / 2, fcy = (ir.top + ir.bottom) / 2;
      move(fcx + 6, fcy + 6); G.update();
      ok("мёртвая зона отсчитывается от середины рамки",
         fileOf(img) === "look-center.png", fileOf(img));
      move(fcx + 300, fcy); G.update();
      ok("сектор вправо — от середины рамки", fileOf(img) === "look-right.png", fileOf(img));
      move(fcx, fcy - 300); G.update();

        // Chrome нормализует "x proximity" в "x": proximity — значение по
        // умолчанию и в computed style опускается. Проверяем ось.
        ok("у ленты действий включён scroll-snap по горизонтали",
           /^x/.test(getComputedStyle(row).scrollSnapType),
           getComputedStyle(row).scrollSnapType);
        ok("у ленты навигации включён scroll-snap по горизонтали",
           /^x/.test(getComputedStyle(navRow0).scrollSnapType),
           getComputedStyle(navRow0).scrollSnapType);
        ok("ряд действий не схлопнут — кнопки внутри своей панели",
           row.getBoundingClientRect().bottom <=
           $(".acts").getBoundingClientRect().bottom + 1);

        var slotSizes = $$(".act").map(function (n) {
          return Math.round(n.getBoundingClientRect().width);
        });
        ok("слоты действий в диапазоне 82-104px",
           slotSizes.every(function (w) { return w >= 82 && w <= 104; }),
           slotSizes.join(" "));
        ok("два главных действия идут первыми",
           $$(".act")[0].dataset.action === "music" &&
           $$(".act")[1].dataset.action === "outfit",
           $$(".act")[0].dataset.action + " " + $$(".act")[1].dataset.action);

        var navRow = $(".stats__list");
        ok("навигация скроллится горизонтально", navRow.scrollWidth > navRow.clientWidth);
        ok("подписи навигации полные, без сокращений",
           $$(".stat__label").map(function (n) { return n.textContent; }).join("|") ===
           SITE_DATA.sections.map(function (x) { return x.label; }).join("|"),
           $$(".stat__label").map(function (n) { return n.textContent; }).join("|"));

        ok("нет горизонтальной прокрутки страницы",
           document.documentElement.scrollWidth <= window.innerWidth + 1,
           document.documentElement.scrollWidth + " > " + window.innerWidth);
        var tooSmallM = $$(".act, .stat, .nav-arrow, .footer__link, .link, .back").filter(function (n) {
          var r2 = n.getBoundingClientRect();
          return r2.height > 0 && (r2.width < 44 || r2.height < 44);
        });
        ok("все тач-цели не мельче 44px", tooSmallM.length === 0,
           tooSmallM.map(function (n) { return n.className.split(" ")[0]; }).join(", "));
      }

      head("регресс: геометрия и тексты");
      ok("у всех img есть alt", $$("img").every(function (i) { return i.hasAttribute("alt"); }));
      ok("нет горизонтального скролла",
         document.documentElement.scrollWidth <= window.innerWidth + 1,
         document.documentElement.scrollWidth + " > " + window.innerWidth);
      // Ниже 760px по высоте страница отпускается в скролл сознательно
      // (см. 07-responsive.css), поэтому проверяем правило, а не следствие.
      var tallEnough = window.innerHeight >= 760;
      if (tallEnough) {
        ok("на высоком вьюпорте страница не скроллится",
           document.documentElement.scrollHeight <= window.innerHeight + 1,
           document.documentElement.scrollHeight + " > " + window.innerHeight);
      } else {
        ok("на низком вьюпорте скролл страницы осознанно разрешён",
           getComputedStyle(document.body).overflowY !== "hidden",
           "innerHeight=" + window.innerHeight + " overflowY=" +
           getComputedStyle(document.body).overflowY);
      }
      ok("контур .px-box не обрезан", getComputedStyle($(".content-frame")).overflow === "visible");

      // Проверка потерялась при перестройке набора в коммите с gaze — возвращена.
      // Иконки подвала по макету 36px на десктопе и вырастают до 44 на тач-
      // ширинах, поэтому здесь они не участвуют: их меряет мобильный прогон.
      var tapSel = ".stat, .card, .back, .link, .nav-arrow, .ribbon__item, .inv__tile, #sound-btn, #menu-btn";
      var tooSmall = $$(tapSel).filter(function (n) {
        var r = n.getBoundingClientRect();
        return r.height > 0 && (r.width < 27 || r.height < 27);
      });
      ok("интерактивные элементы не мельче своей тач-цели", tooSmall.length === 0,
         tooSmall.map(function (n) {
           var r = n.getBoundingClientRect();
           return n.className.split(" ")[0] + " " + Math.round(r.width) + "x" + Math.round(r.height);
         }).join(", "));
      ok("крупные кнопки >= 44px",
         $$(".stat, .card, .back, .link, .ribbon__item").every(function (n) {
           var r = n.getBoundingClientRect();
           return r.height === 0 || r.height >= 44;
         }));
      ok("lang=en", document.documentElement.lang === "en");
      var cyr = /[Ѐ-ӿ]/;
      var bad = [];
      (function walk(n) {
        // сам тест написан по-русски — его собственные узлы не считаем
        if (n.nodeType === 1) {
          var t = n.tagName;
          if (t === "SCRIPT" || t === "STYLE" || n.id === "RESULTS") return;
        }
        if (n.nodeType === 3 && cyr.test(n.nodeValue)) bad.push(n.nodeValue.trim().slice(0, 40));
        for (var i = 0; i < n.childNodes.length; i++) walk(n.childNodes[i]);
      })(document.body);
      $$("img,[alt],[aria-label],[title]").forEach(function (el) {
        ["alt", "aria-label", "title"].forEach(function (a) {
          var v = el.getAttribute(a);
          if (v && cyr.test(v)) bad.push(a + "=" + v.slice(0, 40));
        });
      });
      ok("на странице нет кириллицы (весь текст сайта — EN)", bad.length === 0, bad.join(" | "));

      ok("нет ошибок и предупреждений в консоли", errors.length === 0, errors.join(" ;; "));

      finish();
    })().catch(function (e) {
      out.push("");
      out.push("ИСКЛЮЧЕНИЕ: " + (e && e.stack ? e.stack : e));
      fails++;
      finish();
    });

    function finish() {
      var total = out.filter(function (l) { return /^(PASS|FAIL)/.test(l); }).length;
      out.push("");
      out.push(fails === 0 ? "ИТОГ: все " + total + " проверок пройдены"
                           : "ИТОГ: ПРОВАЛЕНО " + fails + " из " + total);
      $("#RESULTS").textContent = out.join("\n");
    }
  });
})();
</script>
</body>
</html>
